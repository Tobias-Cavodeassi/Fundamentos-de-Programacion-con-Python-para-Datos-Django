{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog Django{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header class="encabezado">
        <h1 class="logo">Blog Django</h1>
        <nav class="menu">
            <a href="{% url 'posts:inicio' %}">Inicio</a>
            <a href="{% url 'posts:lista_posts' %}">Posts</a>
            <a href="{% url 'posts:acerca' %}">Acerca de</a>
        </nav>
    </header>

    <main class="contenido">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="pie">
        <p>Blog Django &middot; Proyecto de práctica</p>
    </footer>
</body>
</html>
