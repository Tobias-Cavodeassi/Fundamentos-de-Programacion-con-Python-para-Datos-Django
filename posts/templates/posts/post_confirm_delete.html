{% extends 'posts/base.html' %}

{% block title %}Eliminar post | Blog Django{% endblock %}

{% block content %}
<section class="seccion">
    <h2>Eliminar post</h2>
    <p>¿Seguro que querés eliminar el post <strong>"{{ post.titulo }}"</strong>? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
        <a class="boton boton-secundario" href="{% url 'posts:detalle_post' post.pk %}">Cancelar</a>
    </form>
</section>
{% endblock %}
